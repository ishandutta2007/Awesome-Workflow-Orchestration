<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Node Glow Gradients -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Filters -->
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.18" />
    </filter>
    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    @keyframes pulseDash {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseDashReverse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 120; }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-12px) scale(1.08); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(12px) scale(0.92); }
    }
    @keyframes nodeBreathe {
      0%, 100% { r: 7px; opacity: 0.9; }
      50% { r: 10px; opacity: 1; }
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: pulseDash 3s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 8 6;
      animation: pulseDashReverse 3.5s linear infinite;
    }
    .node-pulse-1 {
      animation: nodeBreathe 2.5s ease-in-out infinite;
    }
    .node-pulse-2 {
      animation: nodeBreathe 2.5s ease-in-out infinite 0.8s;
    }
    .node-pulse-3 {
      animation: nodeBreathe 2.5s ease-in-out infinite 1.6s;
    }
    .orb-1 {
      animation: floatOrb1 7s ease-in-out infinite;
    }
    .orb-2 {
      animation: floatOrb2 8s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 11px;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle class="orb-1" cx="200" cy="100" r="140" fill="url(#glowCyan)" opacity="0.18" />
  <circle class="orb-2" cx="1020" cy="240" r="160" fill="url(#glowPurple)" opacity="0.22" />
  <circle class="orb-1" cx="600" cy="300" r="120" fill="url(#glowGreen)" opacity="0.12" />

  <!-- Dynamic DAG Flow Lines (Background Network) -->
  <g opacity="0.45">
    <!-- Path 1: Source to Processing -->
    <path class="flow-line" d="M 120 180 C 240 180, 260 90, 380 90" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-line" d="M 120 180 C 240 180, 260 270, 380 270" fill="none" stroke="#818cf8" stroke-width="2.5" />
    <!-- Path 2: Intermediate to Nodes -->
    <path class="flow-line" d="M 380 90 C 500 90, 520 130, 640 130" fill="none" stroke="#a78bfa" stroke-width="2.5" />
    <path class="flow-line" d="M 380 270 C 500 270, 520 230, 640 230" fill="none" stroke="#c084fc" stroke-width="2.5" />
    <!-- Path 3: Aggregation to Outputs -->
    <path class="flow-line-reverse" d="M 640 130 C 760 130, 800 180, 920 180" fill="none" stroke="#f472b6" stroke-width="2.5" />
    <path class="flow-line-reverse" d="M 640 230 C 760 230, 800 180, 920 180" fill="none" stroke="#fbbf24" stroke-width="2.5" />
    <path class="flow-line" d="M 920 180 C 1000 180, 1040 180, 1080 180" fill="none" stroke="#34d399" stroke-width="2.5" />

    <!-- Animated Pulsing DAG Nodes -->
    <circle cx="120" cy="180" r="7" fill="#38bdf8" class="node-pulse-1" />
    <circle cx="380" cy="90" r="7" fill="#818cf8" class="node-pulse-2" />
    <circle cx="380" cy="270" r="7" fill="#818cf8" class="node-pulse-3" />
    <circle cx="640" cy="130" r="7" fill="#c084fc" class="node-pulse-1" />
    <circle cx="640" cy="230" r="7" fill="#c084fc" class="node-pulse-2" />
    <circle cx="920" cy="180" r="8" fill="#f472b6" class="node-pulse-3" />
    <circle cx="1080" cy="180" r="9" fill="#34d399" class="node-pulse-1" />
  </g>

  <!-- Tech Badges / Floating Pills (Background Depth) -->
  <g opacity="0.75" filter="url(#pillGlow)">
    <!-- Pill 1 -->
    <rect x="75" y="45" width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="92" cy="59" r="4" fill="#38bdf8" />
    <text x="105" y="63" fill="#94a3b8" class="badge-text">DAG Scheduling</text>

    <!-- Pill 2 -->
    <rect x="990" y="55" width="135" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <circle cx="1008" cy="69" r="4" fill="#818cf8" />
    <text x="1020" y="73" fill="#94a3b8" class="badge-text">Durable Execution</text>

    <!-- Pill 3 -->
    <rect x="75" y="285" width="135" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <circle cx="92" cy="299" r="4" fill="#c084fc" />
    <text x="105" y="303" fill="#94a3b8" class="badge-text">Data Engineering</text>

    <!-- Pill 4 -->
    <rect x="990" y="275" width="135" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <circle cx="1008" cy="289" r="4" fill="#34d399" />
    <text x="1020" y="293" fill="#94a3b8" class="badge-text">Cloud &amp; K8s Native</text>
  </g>

  <!-- Foreground Glassmorphic Center Card (Guarantees Title & Subtitle Never Get Hidden) -->
  <g filter="url(#cardGlow)">
    <rect x="230" y="65" width="740" height="230" rx="20" fill="rgba(15, 23, 42, 0.78)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  </g>

  <!-- Icon / Mini-Illustration inside Center Card -->
  <g transform="translate(600, 115)">
    <!-- Small Orchestration Hexagon Icon -->
    <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
    <path d="M -8 -6 L 0 -11 L 8 -6 L 8 6 L 0 11 L -8 6 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#f472b6" />
  </g>

  <!-- Main Title (Crisp Foreground) -->
  <text x="600" y="180" text-anchor="middle" fill="url(#titleGradient)" class="title-text" font-size="40" letter-spacing="-0.5">
    Awesome Workflow Orchestration
  </text>

  <!-- Subtitle (Crisp Foreground) -->
  <text x="600" y="222" text-anchor="middle" fill="#e2e8f0" class="sub-text" font-size="16" letter-spacing="0.2">
    Curated Hub for Data Pipelines, DAG Schedulers &amp; Durable Execution Engines
  </text>

  <!-- Feature Tags Row inside Center Card -->
  <g transform="translate(600, 262)">
    <text text-anchor="middle" fill="#94a3b8" class="badge-text" font-size="12">
      ⚡ Airflow • Dagster • Prefect • Temporal • Conductor • Argo • Kestra • Flyte
    </text>
  </g>
</svg>
